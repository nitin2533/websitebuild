
trigger:
  branches:
    include:
      - feature/*
      - main
pr:
  branches:
    include:
      - main
pool:
  name: default   # make sure this is a valid agent pool in your DevOps org
variables:
  workDir: '$(System.DefaultWorkingDirectory)/todo-infra'
stages:
- stage: Destroy
  displayName: "Terraform Destroy Stage"
  jobs:
  - job: TerraformDestroy
    displayName: "Terraform Destroy Job"
    steps:
    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workDir)'
        backendAzureRmStorageAccountName: 'websitestorage1111'
        backendAzureRmContainerName: 'websitecon'
        backendAzureRmKey: 'terraform.tfstate'
        backendServiceArm: 'nitinsubscription'
    - task: TerraformTask@5
      displayName: 'Terraform Destroy'
      inputs:
        provider: 'azurerm'
        command: 'destroy'
        workingDirectory: '$(workDir)'
        backendAzureRmStorageAccountName: 'websitestorage1111'
        environmentServiceNameAzureRM: 'nitinsubscription'
        commandOptions: '-auto-approve'